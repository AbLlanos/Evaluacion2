<body>
    <section class="bg-current text-white py-16">
        <div class="container mx-auto text-center">
            <h2 class="text-4xl font-bold mb-8 text-black">Contáctanos</h2>
            <div class="container mx-auto ">
                <div class=" grid-cols-1 md:grid-cols-2 gap-7 items-center justify-center text-center text-black">
                    <div class="tgridext-center md:text-left">
                        <h2 class="text-3xl font-bold mb-4">¿Tienes alguna pregunta?</h2>
                    </div>
                </div>
            </div>
            <form class="max-w-md mx-auto">
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm font-bold mb-2" for="name">
                        Nombre
                    </label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="name" type="text" placeholder="Tu nombre">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm font-bold mb-2" for="email">
                        Correo electrónico
                    </label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="email" type="email" placeholder="Tu correo electrónico">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-400 text-sm font-bold mb-2" for="message">
                        Mensaje
                    </label>
                    <textarea
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline h-24"
                        id="message" placeholder="Escribe tu mensaje"></textarea>
                </div>
                <div class="flex items-center justify-center">
                    <button
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        type="submit">
                        Enviar
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
